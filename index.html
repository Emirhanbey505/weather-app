<!DOCTYPE html>
<html>
<head>
    <title>Weather App - Emirhan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Weather App 🌤️</h2>
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeather()">Search</button>
        </div>
        <div id="result">
            <h3 id="cityName"></h3>
            <h1 id="temp"></h1>
            <p id="desc"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
